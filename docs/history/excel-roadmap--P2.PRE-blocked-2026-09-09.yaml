roadmap:
  schema_version: '1.0'
  authority: HUMAN_DECLARED_PRIMARY_SCIENTIFIC_ROADMAP
  source_workbook: Bang_ke_hoach_SeqLogAD.xlsx
  source_workbook_sha256: e9212aafec475bf379f4e7836cdf1071332e357492be065107c9aabb83736c42
  worksheets:
  - Executive
  - Roadmap
  - Task Register
  - Gates
  - Traceability
  - Research Sources
  - Task Playbooks
  generated_by: scripts/extract_excel_roadmap.py
  note: Generated projection of the workbook. The workbook wins on any discrepancy; regenerate rather
    than hand-editing this file.
  phases:
  - phase: P1 · Data & Protocol
    timing: W1–W2
    objective: Create multi-source schema, target-buffer contract and leave-one-architecture-out evaluation.
    micro_task_count: 8
    key_outputs: Registry, unified schema, split manifests, leakage audit
    exit_gate: 'G0: Protocol Ready'
    owner: AI + Researcher
  - phase: P2 · Representation & Experts
    timing: W3–W4
    objective: P2.PRE metadata freeze, semantic expert, sequence reference + lighter candidate, GTAT,
      evidence and diversity freeze.
    micro_task_count: 8
    key_outputs: LLM-BASE-001, semantic, two sequence candidates, GTAT, common evidence, diversity/freeze
      package
    exit_gate: 'G2: Expert Diversity Ready'
    owner: AI + Researcher
  - phase: P3 · Adaptation & Fusion
    timing: W5–W6
    objective: Calibrate target normal buffer; validate MLP 8→32→16→3 gate without target labels.
    micro_task_count: 8
    key_outputs: Target memory, drift/uncertainty, fusion gate, explanations
    exit_gate: 'G3: Fusion Justified'
    owner: AI + Researcher
  - phase: P4 · Cross-System Validation
    timing: W7–W8
    objective: Evaluate held-out architectures; test ablation, cold start and contamination; report evidence.
    micro_task_count: 8
    key_outputs: LOAO results, robustness, reproducibility bundle, report
    exit_gate: 'G4: Final Evaluation'
    owner: Researcher + AI
  gates:
  - gate: G0
    decision: Protocol Ready
    required_evidence: At least 3 source architectures; schema, LODO split and label-isolation audit
    forbidden_before_pass: Representation or target adaptation training
    owner: Researcher
    depends_on:
    - P1.1–P1.8
    workbook_status: Passed
    evidence_link: data/processed/protocol/G0-receipt.json
  - gate: G1
    decision: Adaptation Ready
    required_evidence: Normal burn-in assumption, contamination bound, local-memory/calibration tests
    forbidden_before_pass: Use target labels or silent recalibration
    owner: Researcher
    depends_on:
    - P1.6
    - P3.2–P3.5
    workbook_status: Not passed
    evidence_link: —
  - gate: G2
    decision: Expert Diversity
    required_evidence: Held-out source results, disagreement/double-fault and evidence contract
    forbidden_before_pass: Adaptive learned fusion
    owner: Researcher
    depends_on:
    - P2.PRE
    - P2.1–P2.7
    workbook_status: Not passed
    evidence_link: —
  - gate: G3
    decision: Fusion Justified
    required_evidence: MLP gate vs single/equal/Transformer/IF baselines; FAR/stability checks
    forbidden_before_pass: Final claim that fusion is superior
    owner: Researcher
    depends_on:
    - P3.6–P3.8
    workbook_status: Not passed
    evidence_link: —
  - gate: G4
    decision: Final Evaluation
    required_evidence: Data/model/buffer/gate/threshold freeze and reproducibility receipt
    forbidden_before_pass: Post-hoc tuning or universal-generalisation claim
    owner: Researcher
    depends_on:
    - P4.1–P4.7
    workbook_status: Not passed
    evidence_link: —
  research_questions:
  - rq: RQ1
    question: Can a representation generalise across log syntaxes?
    primary_metric: Per-target AP/PR-AUC + CI
    unit_of_evaluation: held-out architecture
    task_ids:
    - P1–P2
    required_evidence: LOAO splits + expert runs
    claim_allowed: Generalises across evaluated targets
    claim_forbidden: Universal generalisation
  - rq: RQ2
    question: Can target normal-only adaptation calibrate unseen systems?
    primary_metric: FAR, calibration, abstention
    unit_of_evaluation: target normal buffer + later logs
    task_ids:
    - P1.6
    - P3.2–P3.5
    required_evidence: buffer hash + calibration run
    claim_allowed: Adapts without target labels
    claim_forbidden: Works before sufficient normal buffer
  - rq: RQ3
    question: Does adaptive fusion add value?
    primary_metric: AP/FAR vs Llama/GTAT/single/equal/legacy baselines
    unit_of_evaluation: architecture × fold
    task_ids:
    - P3.6–P3.8
    - P4.3
    required_evidence: paired result + ablation
    claim_allowed: Stable gain on evaluated domains
    claim_forbidden: Gain from arbitrary score sum
  - rq: RQ4
    question: What happens under drift/cold start/contamination?
    primary_metric: degradation + latency
    unit_of_evaluation: robustness scenario
    task_ids:
    - P4.4–P4.5
    required_evidence: scenario bundles
    claim_allowed: Known operating envelope
    claim_forbidden: Robust to all drift
  - rq: RQ5
    question: Are conclusions reproducible?
    primary_metric: hash/config/seed audit
    unit_of_evaluation: final bundle
    task_ids:
    - P4.6–P4.8
    required_evidence: repro + claim map
    claim_allowed: Traceable conclusion
    claim_forbidden: Unbacked metric/claim
  research_sources:
  - key: S1
    reference: Loghub — Zhu et al. (2020)
    type: arXiv / Loghub
    contribution: Dataset inventory, provenance, architecture diversity
    use_boundary: Dataset availability only; do not infer labels or licences without checking registry
    url: https://arxiv.org/abs/2008.06448
    workbook_status: Verified
  - key: S2
    reference: Drain — He et al. (2017)
    type: IEEE ICWS
    contribution: Optional parser/template field; retain raw logs
    use_boundary: Parser support only; not an anomaly model
    url: https://doi.org/10.1109/ICWS.2017.13
    workbook_status: Verified
  - key: S3
    reference: LogDLR — Liu et al. (2025)
    type: IEEE TDSC
    contribution: Cross-system, domain-invariant representation, adversarial branch
    use_boundary: Architecture inspiration; no performance transferred to this project
    url: https://ieeexplore.ieee.org/abstract/document/10910212/
    workbook_status: Verified
  - key: S4
    reference: ZeroLog — Zhao et al. (2025)
    type: arXiv preprint
    contribution: Zero-label target protocol and meta-learning direction
    use_boundary: Preprint; use as research design reference, not established fact
    url: https://arxiv.org/abs/2511.05862
    workbook_status: Verified
  - key: S5
    reference: LogLLaMA — Yang & Harris (2025)
    type: arXiv preprint
    contribution: LLaMA direction and next-log modeling
    use_boundary: Uses LLaMA2; does not validate this project’s Llama-3.1 design
    url: https://arxiv.org/abs/2503.14849
    workbook_status: Verified
  - key: S6
    reference: LogGT — Wang et al. (2024)
    type: Expert Systems with Applications
    contribution: Event/component/time graph and GTAT direction
    use_boundary: Architecture reference; results are not copied into this project
    url: https://doi.org/10.1016/j.eswa.2024.124082
    workbook_status: Verified
  - key: S7
    reference: LoRA — Hu et al. (2021)
    type: arXiv
    contribution: Frozen base + separate low-rank adapters
    use_boundary: Does not establish task-specific performance
    url: https://arxiv.org/abs/2106.09685
    workbook_status: Verified
  - key: S8
    reference: DANN — Ganin et al. (2015)
    type: JMLR / arXiv
    contribution: Optional adversarial domain adaptation
    use_boundary: Use only after diagnostic + ablation; not assumed beneficial
    url: https://arxiv.org/abs/1505.07818
    workbook_status: Verified
  - key: S9
    reference: SelectiveNet — Geifman & El-Yaniv (2019)
    type: ICML / PMLR
    contribution: Abstention and risk–coverage framing
    use_boundary: Does not set an automatic threshold for this project
    url: https://proceedings.mlr.press/v97/geifman19a.html
    workbook_status: Verified
  - key: S10
    reference: Isolation Forest — Liu et al. (2008)
    type: IEEE ICDM
    contribution: Explicit anomaly baseline
    use_boundary: Baseline only; feature/budget policy must be declared locally
    url: https://doi.org/10.1109/ICDM.2008.17
    workbook_status: Verified
  - key: S11
    reference: Meta Llama 3.1 (2024)
    type: Meta official release
    contribution: Base-model revision, license and tokenizer provenance
    use_boundary: Official model information; still require project-specific evaluation
    url: https://ai.meta.com/blog/meta-llama-3-1/
    workbook_status: Verified
  tasks:
  - task_id: P1.1
    phase: P1 · Data & Protocol
    workstream: Research scope
    task_class: Must
    micro_task: Chốt định nghĩa source architecture, unseen target và zero-label target adaptation
    output: Scope memo
    owner: Người nghiên cứu
    timing: Week 1
    dependencies: []
    definition_of_done: Không còn claim chỉ HDFS/BGL; target labels bị cấm trong adaptation.
    workbook_status: Done
    playbook:
      method: '1) Viết scope memo có định nghĩa “architecture” theo hệ thống/nguồn log, không theo EventID.

        2) Vẽ một fold: source architectures → target architecture → target buffer → evaluation.

        3) Liệt kê trường dữ liệu bị cấm ở từng bước (đặc biệt target labels).'
      required_evidence: Scope memo, sơ đồ fold, danh sách trường bị cấm, người duyệt.
      verifiable_dod: Memo nêu rõ target chưa thấy; adaptation không đọc target label; sơ đồ và policy
        được reviewer ký. Không tuyên bố hiệu năng.
      citations:
      - S3
      - S4
  - task_id: P1.2
    phase: P1 · Data & Protocol
    workstream: Dataset portfolio
    task_class: Must
    micro_task: Lập inventory ít nhất 3 source architectures và 1 held-out target mỗi fold
    output: Dataset registry
    owner: AI + Người nghiên cứu
    timing: Week 1
    dependencies:
    - P1.1
    definition_of_done: Mỗi dataset có licence, format, chronology và label availability rõ ràng.
    workbook_status: Done
    playbook:
      method: '1) Chọn tối thiểu 3 architecture khác họ hệ thống khi khả thi.

        2) Với từng bộ dữ liệu, ghi URL/giấy phép, số dòng, timestamp, nhãn, đơn vị session và SHA-256.

        3) Chỉ đưa dữ liệu có provenance vào registry.'
      required_evidence: dataset_registry.csv + LICENSE/URL + checksum + metadata snapshot.
      verifiable_dod: Mọi dataset có provenance, khả năng dùng nhãn và phạm vi thời gian; mỗi fold có
        target held-out xác định trước.
      citations:
      - S1
      - S3
      - S4
  - task_id: P1.3
    phase: P1 · Data & Protocol
    workstream: Canonical schema
    task_class: Must
    micro_task: 'Thiết kế schema chung: timestamp, level, service, component, message, session/trace optional'
    output: LOG-UNIFY-001
    owner: AI
    timing: Week 1
    dependencies:
    - P1.2
    definition_of_done: Missing fields/format variation có handling contract.
    workbook_status: Done
    playbook:
      method: '1) Lập data dictionary cho timestamp, level, service, component, raw_message, session/trace
        và missingness.

        2) Chuyển từng nguồn vào schema; giữ source_row_id bất biến.

        3) Viết unit test cho timezone, null, parse failure và type.'
      required_evidence: LOG-UNIFY-001, mapping per source, test report.
      verifiable_dod: Schema versioned; 100% trường required/nullable có quy tắc; lỗi parse được đếm và
        không bị im lặng loại bỏ.
      citations:
      - S1
      - S6
  - task_id: P1.4
    phase: P1 · Data & Protocol
    workstream: Normalisation
    task_class: Must
    micro_task: Mask ID/IP/UUID/numbers; giữ raw message và optional Drain3 template
    output: Normaliser
    owner: AI
    timing: Week 1
    dependencies:
    - P1.3
    definition_of_done: Raw semantic text không bị mất; transform deterministic.
    workbook_status: Done
    playbook:
      method: '1) Giữ raw_message bất biến; tạo normalized_message ở cột mới.

        2) Mask ID/IP/UUID/số bằng rule versioned, có ngoại lệ để không xóa token nghiệp vụ.

        3) Chạy transform hai lần và so hash; Drain3 template chỉ là trường phụ trợ.'
      required_evidence: Rule file, golden cases, before/after sample, deterministic hash.
      verifiable_dod: Raw text còn truy xuất được; transform deterministic; tỷ lệ match/rơi log báo cáo;
        template không thay raw text.
      citations:
      - S2
      - S6
  - task_id: P1.5
    phase: P1 · Data & Protocol
    workstream: Split
    task_class: Must
    micro_task: Thiết kế chronological leave-one-architecture-out source/target folds
    output: CS-SPLIT-001
    owner: AI
    timing: Week 1
    dependencies:
    - P1.2
    definition_of_done: Target architecture không xuất hiện trong source train của fold.
    workbook_status: Done
    playbook:
      method: '1) Chọn target architecture trước khi train và tách toàn bộ target khỏi source.

        2) Trong mỗi architecture, split theo thời gian: train/normal-buffer/eval theo chronology.

        3) Xuất manifest gồm IDs, time boundary, hashes và seed.'
      required_evidence: CS-SPLIT-001 manifests, overlap scan, fold diagram.
      verifiable_dod: Không có target architecture trong source train; không có thời điểm evaluation đi
        vào train/buffer; manifest tái tạo cùng split.
      citations:
      - S3
      - S4
      - S6
  - task_id: P1.6
    phase: P1 · Data & Protocol
    workstream: Target buffer
    task_class: Must
    micro_task: Định nghĩa target normal burn-in, contamination bound và readiness checks
    output: ADAPT-INPUT-001
    owner: Người nghiên cứu
    timing: Week 2
    dependencies:
    - P1.3
    - P1.5
    definition_of_done: Không dùng target labels; buffer version/hash/provenance đầy đủ.
    workbook_status: Done
    playbook:
      method: '1) Định nghĩa burn-in duration, sampling rule, contamination assumption/bound và readiness
        minima trước khi xem kết quả.

        2) Lưu hash và provenance buffer.

        3) Gắn cờ “not ready/unknown” nếu thiếu coverage; không suy từ target labels.'
      required_evidence: ADAPT-INPUT-001, buffer manifest, readiness checklist.
      verifiable_dod: Buffer không chứa cột/lookup target label; assumptions, hash, duration và rejection
        rule có chữ ký researcher.
      citations:
      - S4
      - S9
  - task_id: P1.7
    phase: P1 · Data & Protocol
    workstream: Isolation audit
    task_class: Must
    micro_task: Audit chronology, source-target leakage, duplicate và label isolation
    output: LEAK-CS-001
    owner: AI
    timing: Week 2
    dependencies:
    - P1.4
    - P1.5
    - P1.6
    definition_of_done: Audit pass trước representation training; labels chỉ ở evaluation boundary.
    workbook_status: Done
    playbook:
      method: '1) Kiểm tra duplicate bằng hash raw/normalized; kiểm tra session/time overlap.

        2) Quét code/config bảo đảm labels chỉ mở ở evaluation boundary.

        3) Lập danh sách exception có lý do và người phê duyệt.'
      required_evidence: LEAK-CS-001 with duplicate, overlap and label-access reports.
      verifiable_dod: Leakage audit pass hoặc exception được resolve; không train/tune/calibrate bằng
        target label; report tái chạy được từ manifest.
      citations:
      - S3
      - S4
  - task_id: P1.8
    phase: P1 · Data & Protocol
    workstream: Freeze
    task_class: Must
    micro_task: Freeze data/schema/fold config và reproducible commands
    output: G0 receipt
    owner: AI + Người nghiên cứu
    timing: Week 2
    dependencies:
    - P1.7
    definition_of_done: G0 Protocol Ready được ký; no empirical claims yet.
    workbook_status: Done
    playbook:
      method: '1) Khóa schema, normalizer, dataset registry, split manifest và env lockfile.

        2) Ghi command tái tạo từng artifact và SHA-256.

        3) Gate review chỉ xác nhận protocol, không đánh giá model.'
      required_evidence: G0 receipt, version manifest, reproducible command list.
      verifiable_dod: G0 được ký; mọi input/config hashable; các task representation/adaptation chưa được
        chạy trước G0.
      citations:
      - S1
      - S4
  - task_id: P2.PRE
    phase: P2 · Representation & Experts
    workstream: Base Model / Tokenizer / Revision Freeze
    task_class: Must
    micro_task: 'Freeze metadata only: base/tokenizer IDs and exact commits, quantization/precision, context,
      PEFT/LoRA versions, license/access, GPU/budget, seeds, artifact naming and provenance. No model
      download; runtime smoke-load belongs to P2.1 preflight.'
    output: LLM-BASE-001
    owner: Người nghiên cứu
    timing: Week 3
    dependencies:
    - P1.8
    definition_of_done: All required metadata resolved and reviewed under configs/models/base-freeze-v1.yaml;
      immutable revisions, policy/lock hashes and access evidence recorded. No placeholder permits PASS.
    workbook_status: Blocked
    playbook:
      method: 'Freeze metadata only: base/tokenizer IDs and exact commits, quantization/precision, context,
        PEFT/LoRA versions, license/access, GPU/budget, seeds, artifact naming and provenance. No model
        download; runtime smoke-load belongs to P2.1 preflight.'
      required_evidence: LLM-BASE-001
      verifiable_dod: All required metadata resolved and reviewed under configs/models/base-freeze-v1.yaml;
        immutable revisions, policy/lock hashes and access evidence recorded. No placeholder permits PASS.
      citations:
      - S11
      - S7
  - task_id: P2.1
    phase: P2 · Representation & Experts
    workstream: Semantic Expert
    task_class: Must
    micro_task: Implement semantic self-supervision and scoring with independent LoRA-Semantic. Retain
      source alignment / domain-adversarial diagnostic as conditional REP-DG-001 with explicit disposition;
      no target inputs or anomaly labels. Require portable data and training notebook.
    output: LORA-SEM-001; REP-DG-001 (conditional); EXP-SEM-001
    owner: AI
    timing: Week 3
    dependencies:
    - P2.PRE
    definition_of_done: P2.PRE PASS before execution; independent adapter and scoring provenance, label-free
      source train/validation, semantic notebook and tests; REP-DG-001 conditional disposition recorded.
    workbook_status: Not started
    playbook:
      method: Implement semantic self-supervision and scoring with independent LoRA-Semantic. Retain source
        alignment / domain-adversarial diagnostic as conditional REP-DG-001 with explicit disposition;
        no target inputs or anomaly labels. Require portable data and training notebook.
      required_evidence: LORA-SEM-001; REP-DG-001 (conditional); EXP-SEM-001
      verifiable_dod: P2.PRE PASS before execution; independent adapter and scoring provenance, label-free
        source train/validation, semantic notebook and tests; REP-DG-001 conditional disposition recorded.
      citations:
      - S7
      - S5
      - S11
      - S3
      - S8
      - S4
  - task_id: P2.2
    phase: P2 · Representation & Experts
    workstream: Sequence Reference Framework
    task_class: Must
    micro_task: Retain separate LoRA-Sequence as reference candidate; ordered next-event/log objective,
      context evidence and boundary tests. No shared adapter weights/state; require portable data and
      training notebook.
    output: LORA-SEQ-001; EXP-SEQ-001
    owner: AI
    timing: Week 3
    dependencies:
    - P2.1
    definition_of_done: Independent reference checkpoint/config; order, session/partition boundaries and
      six sequence controls testable; notebook and lineage complete.
    workbook_status: Not started
    playbook:
      method: Retain separate LoRA-Sequence as reference candidate; ordered next-event/log objective,
        context evidence and boundary tests. No shared adapter weights/state; require portable data and
        training notebook.
      required_evidence: LORA-SEQ-001; EXP-SEQ-001
      verifiable_dod: Independent reference checkpoint/config; order, session/partition boundaries and
        six sequence controls testable; notebook and lineage complete.
      citations:
      - S5
      - S7
      - S11
      - S4
  - task_id: P2.3
    phase: P2 · Representation & Experts
    workstream: Lightweight Sequence Expert
    task_class: Must
    micro_task: Compare at least one substantially lighter explicit sequence architecture on the same
      contexts and budgets. Preregister resource criterion; no winner assumed. Require training notebook;
      reuse sequence view.
    output: EXP-SEQ-LIGHT-001
    owner: AI
    timing: Week 4
    dependencies:
    - P2.2
    definition_of_done: Required lighter candidate evaluated under frozen resource criterion and shared
      contexts; all six sequence controls, cost/quality evidence and notebook; no unsupported winner claim.
    workbook_status: Not started
    playbook:
      method: Compare at least one substantially lighter explicit sequence architecture on the same contexts
        and budgets. Preregister resource criterion; no winner assumed. Require training notebook; reuse
        sequence view.
      required_evidence: EXP-SEQ-LIGHT-001
      verifiable_dod: Required lighter candidate evaluated under frozen resource criterion and shared
        contexts; all six sequence controls, cost/quality evidence and notebook; no unsupported winner
        claim.
      citations:
      - S5
      - S4
  - task_id: P2.4
    phase: P2 · Representation & Experts
    workstream: GTAT Expert
    task_class: Must
    micro_task: Freeze exact GTAT source and graph/temporal specification before training. Report coverage/abstain
      for missing fields. Structural-temporal role cannot silently replace sequence role; require graph
      view and training notebook.
    output: EXP-GTAT-001
    owner: AI
    timing: Week 4
    dependencies:
    - P2.3
    definition_of_done: Exact graph source/spec/objective frozen; coverage and temporal expressiveness
      tested; missing topology yields unknown; notebook and lineage complete.
    workbook_status: Not started
    playbook:
      method: Freeze exact GTAT source and graph/temporal specification before training. Report coverage/abstain
        for missing fields. Structural-temporal role cannot silently replace sequence role; require graph
        view and training notebook.
      required_evidence: EXP-GTAT-001
      verifiable_dod: Exact graph source/spec/objective frozen; coverage and temporal expressiveness tested;
        missing topology yields unknown; notebook and lineage complete.
      citations:
      - S6
  - task_id: P2.5
    phase: P2 · Representation & Experts
    workstream: Common Evidence Contract
    task_class: Must
    micro_task: Validate common evidence across all four candidates; raw score, uncertainty/unknown, coverage,
      record IDs and version lineage. Phase-2 calibrated score remains null; reject missing provenance.
    output: EVID-CS-001
    owner: AI
    timing: Week 4
    dependencies:
    - P2.4
    definition_of_done: All four candidate outputs validate common contract; unknown is explicit; no calibration,
      fabricated certainty or missing version/coverage.
    workbook_status: Not started
    playbook:
      method: Validate common evidence across all four candidates; raw score, uncertainty/unknown, coverage,
        record IDs and version lineage. Phase-2 calibrated score remains null; reject missing provenance.
      required_evidence: EVID-CS-001
      verifiable_dod: All four candidate outputs validate common contract; unknown is explicit; no calibration,
        fabricated certainty or missing version/coverage.
      citations:
      - S5
      - S6
      - S9
  - task_id: P2.6
    phase: P2 · Representation & Experts
    workstream: Expert Diversity / Scientific Evaluation
    task_class: Must
    micro_task: Own source-held-out diversity diagnostics and sequence controls for all candidates. No
      target inputs or adaptive fusion. Source-label metrics remain blocked pending explicit evaluation
      permission; no fabricated metrics.
    output: P2-DIVERSITY-001 (G2 prep)
    owner: Người nghiên cứu
    timing: Week 4
    dependencies:
    - P2.5
    definition_of_done: Versioned source diagnostics, redundancy and resource comparison; report unsupported
      capability. C2 blocks supervised metrics and completion evidence depending on them; no gate fitting.
    workbook_status: Not started
    playbook:
      method: Own source-held-out diversity diagnostics and sequence controls for all candidates. No target
        inputs or adaptive fusion. Source-label metrics remain blocked pending explicit evaluation permission;
        no fabricated metrics.
      required_evidence: P2-DIVERSITY-001 (G2 prep)
      verifiable_dod: Versioned source diagnostics, redundancy and resource comparison; report unsupported
        capability. C2 blocks supervised metrics and completion evidence depending on them; no gate fitting.
      citations:
      - S3
      - S6
  - task_id: P2.7
    phase: P2 · Representation & Experts
    workstream: Final Phase-2 Freeze
    task_class: Must
    micro_task: Freeze candidate dispositions, retained reference artifacts, common interface and reproducibility
