[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sequence-aware-log-investigation"
version = "0.1.0"
description = "Research skeleton for sequence-aware log anomaly detection and evidence-grounded investigation."
requires-python = ">=3.11"
dependencies = [
    "drain3>=0.9,<1",
    "polars>=1,<2",
    "pyarrow>=17,<20",
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
