    root: data/phase2
    semantic: data/phase2/folds/{fold_id}/semantic
    sequence: data/phase2/folds/{fold_id}/sequence
    graph: data/phase2/folds/{fold_id}/graph
    created: false
    source_label_scope: UNRESOLVED_DENY
  review:
    status: ENGINEERING_POLICIES_REVIEWED_ACCESS_EVIDENCE_PENDING
    evidence: docs/protocol/P2.PRE-base-model-freeze.md
    gate_signature_created: false
  unresolved_fields:
  - access.owner_confirmation
  - access.authenticated_metadata_verified
  - revision_policy.model_config_sha256
  - revision_policy.tokenizer_config_sha256
  - tokenizer.resolved_class
  pass_criteria:
  - Official immutable model/tokenizer identities verified
  - Authenticated pinned config/tokenizer metadata read and hashed; actual loading class/special-token contract
    checked
  - Owner license/access acceptance and account eligibility confirmation recorded without secrets
  - All frozen runtime/precision/quantization/artifact policies consistent and tests pass
  - Only then mark PASS and migrate workbook/routing to P2.1 without starting it
  future_runtime_preflight:
    owner: P2.1
    required_before_training: true
    executed: false
    checks:
    - model/tokenizer smoke-load
    - revision and metadata/hash agreement
    - GPU kernel and precision support
    - finite forward/backward on allowed source inputs
    - peak VRAM and throughput
    - adapter isolation and frozen base assertion
    - Linux lock/pip check/import verification
  planned_artifact: reports/phase2/base-freeze/LLM-BASE-001.json
