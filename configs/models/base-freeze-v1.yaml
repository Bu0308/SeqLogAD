    tokenizer_revision_commit: Immutable tokenizer commit; record explicit identity even if equal to model
      commit.
    quantization_policy: Explicit none or method, bits, compute/storage dtypes and version constraints.
    precision_policy: Parameter, compute and optimizer dtypes; hardware assumptions.
    peft_lora_library_constraints: Pin compatible peft, transformers, torch, accelerate and quantization
      backend if used; lockfile/hash. LoRA implementation/version recorded; ranks/targets remain task-specific
      until frozen before run.
    expected_context_length: Numeric context cap, tokenizer limits, truncation policy and future runtime
      verification.
    access_requirements_and_verification: License/access eligibility evidence without credentials or downloading
      weights.
    artifact_checkpoint_naming: Versioned run identity with task/expert/fold/seed/revisions and checkpoint
      hashes; no overwrites.
    reproducibility_metadata: Seeds, config/lock/provenance hashes, model/tokenizer source URLs and verification
      date, environment policy, deterministic settings/limitations.
  pass_criteria:
  - Every required_metadata value non-null and concrete; no TBD/main/latest placeholders.
  - Exact immutable revisions verified from official metadata without weight downloads.
  - Compatible version constraints, licensing/access evidence and context/resource policies reviewed and
    recorded.
