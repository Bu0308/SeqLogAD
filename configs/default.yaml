# Research Freeze v1.1 convention skeleton. Not a runnable experiment config.
project:
  name: seqlogad
  experiment_id: EXP-YYYYMMDD-NNN
  seed: 42

# Intentional per-run placeholders owned by future dataset/run configs. They are
# not stale foundation status.
dataset:
  name: TODO
  version: TODO
  fingerprint: TODO
  raw_path: TODO
  processed_path: TODO

protocol:
  contract: configs/protocols/protocol-v1.1.yaml
  binding_addenda:
    - configs/protocols/effect-001.yaml
    - configs/protocols/split-clarification-v1.yaml
  statistical_addendum: configs/protocols/effect-001.yaml
  statistical_addendum_status: FROZEN_HUMAN_APPROVED
  split_addendum: configs/protocols/split-clarification-v1.yaml
  split_addendum_status: FROZEN_HUMAN_APPROVED
  active_state_registry: configs/active-state.yaml
  empirical_status: NOT_RUN
  execution_ready: false
  split_status: COMPLETE

parsing:
  parser: drain3
  fit_partition: BASE_TRAIN
  fit_normal_only: true
  contract: configs/parsing/drain3-v1.yaml
  state_artifact_registry: configs/active-state.yaml
  state_artifact_registry_key: datasets.<dataset>.parser
  status: COMPLETE_FROZEN

# Intentional SEQ-001 placeholders; no sequence artifact exists yet.
sequence:
  strategy: TODO
  window_size: TODO
  grouping_key: TODO

split:
  strategy: raw_chronological
  boundary_algorithm: cumulative_floor
  exact_contract: configs/protocols/split-clarification-v1.yaml
  base_train: 0.60
  fusion_train_reserved: 0.10
  val_expert: 0.10
  val_fusion_reserved: 0.10
  test: 0.10
  physical_test_guard: data/processed/splits/<dataset>/test-seal.json
  physical_test_state: SEALED_NEVER_OPENED
  artifact_registry: configs/active-state.yaml
  artifact_registry_key: datasets.<dataset>.split

pipeline:
  SPLIT-001: COMPLETE
  PARSE-001: COMPLETE_FROZEN
  PURGE-AUDIT-001: COMPLETE
  PURGE-DECISION-001: HUMAN_DECISION_REQUIRED
  CANONICAL-EVENT-001: NOT_STARTED
  next_scientific_task: PURGE-DECISION-001

repository_hygiene:
  license_status: OWNER_DECISION_REQUIRED

methods:
  must: [unseen_event_type, sequence_length, total_event_count, count_vector, isolation_forest, markov_ngram]
  should: []
  conditional: [transformer, localization, simple_fusion]

# Intentional future evaluation placeholders; TEST remains sealed.
scoring:
  aggregation: TODO
  threshold_strategy: TODO_VALIDATION_ONLY
  primary_metric: average_precision
  practical_effect:
    framework: RESOURCE_FEASIBILITY_MARGIN
    hdfs: 0.01
    bgl: 0.01

output:
  root: outputs
  run_dir: outputs/runs/EXP-YYYYMMDD-NNN

logging:
  level: INFO
